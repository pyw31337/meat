<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>메가마트 소고기 & 돼지고기 가격 추이 대시보드</title>
    <!-- Premium Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700&family=Outfit:wght@300;400;500;700&display=swap" rel="stylesheet">
    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root {
            --bg-color: #0b0c10;
            --card-bg: #1f2833;
            --text-primary: #ffffff;
            --text-secondary: #c5a059;
            --accent-color: #66fcf1;
            --accent-hover: #45f3e5;
            --border-color: #45a29e;
        }
        body {
            background-color: var(--bg-color);
            color: var(--text-primary);
            font-family: 'Outfit', 'Noto Sans KR', sans-serif;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }
        .container {
            width: 100%;
            max-width: 1000px;
            margin: 20px 0;
        }
        header {
            text-align: center;
            margin-bottom: 30px;
        }
        h1 {
            font-size: 2.2rem;
            font-weight: 700;
            margin: 10px 0;
            background: linear-gradient(45deg, #ffffff, var(--accent-color));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .subtitle {
            color: var(--text-secondary);
            font-size: 1.1rem;
            font-weight: 400;
        }
        .card {
            background-color: var(--card-bg);
            border: 1px solid rgba(69, 162, 158, 0.2);
            border-radius: 16px;
            padding: 24px;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
            backdrop-filter: blur(4px);
            margin-bottom: 24px;
        }
        .controls-row {
            display: flex;
            flex-wrap: wrap;
            justify-content: space-between;
            align-items: center;
            gap: 15px;
            margin-bottom: 20px;
        }
        .filter-group {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .filter-label {
            font-weight: 500;
            color: var(--text-secondary);
            margin-right: 5px;
        }
        .btn-group {
            display: flex;
            gap: 8px;
        }
        button {
            background-color: #0b0c10;
            color: #ffffff;
            border: 1px solid var(--border-color);
            padding: 8px 16px;
            border-radius: 20px;
            cursor: pointer;
            font-family: inherit;
            font-weight: 500;
            transition: all 0.3s ease;
        }
        button:hover {
            border-color: var(--accent-color);
            color: var(--accent-color);
        }
        button.active {
            background-color: var(--accent-color);
            color: #0b0c10;
            border-color: var(--accent-color);
            box-shadow: 0 0 10px rgba(102, 252, 241, 0.4);
        }
        .checkbox-container {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            margin-top: 15px;
            padding-top: 15px;
            border-top: 1px solid rgba(69, 162, 158, 0.15);
        }
        .checkbox-item {
            display: flex;
            align-items: center;
            gap: 8px;
            background: rgba(11, 12, 16, 0.5);
            padding: 8px 16px;
            border-radius: 20px;
            border: 1px solid rgba(69, 162, 158, 0.15);
            cursor: pointer;
            user-select: none;
            transition: all 0.3s ease;
        }
        .checkbox-item:hover {
            border-color: var(--accent-color);
        }
        .checkbox-item.active {
            border-color: var(--accent-color);
            background: rgba(102, 252, 241, 0.1);
        }
        .checkbox-item input {
            display: none;
        }
        .checkbox-item .indicator {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background-color: #555;
            transition: all 0.3s ease;
        }
        .checkbox-item.active .indicator {
            background-color: var(--accent-color);
            box-shadow: 0 0 8px var(--accent-color);
        }
        .chart-container {
            position: relative;
            height: 380px;
            width: 100%;
        }
        .info-footer {
            text-align: center;
            color: #666;
            font-size: 0.9rem;
            margin-top: 20px;
        }
    </style>
</head>

    <div class="container">
        <header>
            <h1>🥩 소고기 & 🐷 돼지고기 가격 대시보드</h1>
            <div class="subtitle">메가마트 한우 등심 & 국내산 삼겹살 가격 실시간 모니터링</div>

    </div>

                                mode: 'index',
                                intersect: false,
                                callbacks: {
                                    label: function(context) {
                                        let label = context.dataset.label || '';
                                        if (label) {
                                            label += ': ';
                                        }
                                        if (context.parsed.y !== null) {
                                            label += new Intl.NumberFormat('ko-KR', { style: 'currency', currency: 'KRW' }).format(context.parsed.y).replace('₩', '') + '원';
                                        }
                                        return label;
                                    }
                                }
                            }
                        }
                    }
                };
            };

            // 1. Update Beef Chart
            if (beefChart) {
                beefChart.destroy();
            }
            beefChart = new Chart(
                document.getElementById('priceChartBeef').getContext('2d'),
                buildChartConfig((prod) => !prod.includes("삼겹살"), 7000, '알림 기준가 (7,000원)')
            );

            // 2. Update Pork Chart
            if (porkChart) {
                porkChart.destroy();
            }
            porkChart = new Chart(
                document.getElementById('priceChartPork').getContext('2d'),
                buildChartConfig((prod) => prod.includes("삼겹살"), 2000, '알림 기준가 (2,000원)')
            );
        };

        // Initial render
        updateCharts();
    </script>
</body>
</html>
