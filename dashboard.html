<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>메가마트 가격 추이 - 동적 대시보드</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chartjs-adapter-date-fns@3.0.0/dist/chartjs-adapter-date-fns.bundle.min.js"></script>
    <style>
        :root {
            --bg: #0f1419;
            --card: #1a1f2e;
            --text: #e6edf3;
            --muted: #8b949e;
            --accent: #58a6ff;
            --beef: #f85149;
            --pork: #3fb950;
            --border: #30363d;
        }
        * { box-sizing: border-box; }
        body {
            margin: 0;
            font-family: 'Noto Sans KR', system-ui, sans-serif;
            background: var(--bg);
            color: var(--text);
            line-height: 1.5;
        }
        .container { max-width: 1200px; margin: 0 auto; padding: 20px; }
        header { text-align: center; margin-bottom: 28px; }
        h1 { font-size: 1.8rem; margin: 0 0 8px; font-weight: 700; }
        .subtitle { color: var(--muted); font-size: 0.95rem; }
        .controls {
            display: flex; flex-wrap: wrap; gap: 12px; align-items: center;
            background: var(--card); border: 1px solid var(--border);
            border-radius: 12px; padding: 16px; margin-bottom: 20px;
        }
        .btn-group { display: flex; gap: 6px; flex-wrap: wrap; }
        button {
            background: #21262d; color: var(--text); border: 1px solid var(--border);
            padding: 6px 14px; border-radius: 8px; cursor: pointer; font-family: inherit;
            font-size: 0.9rem;
        }
        button.active, button:hover { border-color: var(--accent); color: var(--accent); }
        button.active { background: rgba(88,166,255,0.15); }
        .chart-card {
            background: var(--card); border: 1px solid var(--border);
            border-radius: 12px; padding: 16px; margin-bottom: 20px;
        }
        .chart-card h2 { margin: 0 0 12px; font-size: 1.1rem; }
        .chart-wrap { position: relative; height: 380px; }
        .product-filters { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 8px; }
        .chip {
            display: inline-flex; align-items: center; gap: 6px;
            background: #21262d; border: 1px solid var(--border);
            padding: 4px 10px; border-radius: 20px; font-size: 0.85rem; cursor: pointer;
        }
        .chip input { display: none; }
        .chip.active { border-color: var(--accent); background: rgba(88,166,255,0.12); }
        .status { font-size: 0.85rem; color: var(--muted); margin-top: 8px; }
        .legend-note { font-size: 0.8rem; color: var(--muted); margin-top: 4px; }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>🥩 메가마트 한우 등심 & 삼겹살 가격 추이</h1>
            <div class="subtitle">동적 차트 · CSV 실시간 로드 · 한글 깨짐 없음</div>
        </header>

        <div class="controls">
            <span style="color:var(--muted);">기간:</span>
            <div class="btn-group">
                <button data-days="7">7일</button>
                <button data-days="30">30일</button>
                <button data-days="90">90일</button>
                <button data-days="0" class="active">전체</button>
            </div>
            <span style="color:var(--muted); margin-left:12px;">종류:</span>
            <div class="btn-group">
                <button data-type="all" class="active">전체</button>
                <button data-type="beef">소고기</button>
                <button data-type="pork">돼지고기</button>
            </div>
        </div>

        <div class="chart-card">
            <h2>가격 추이 (100g당 원)</h2>
            <div class="chart-wrap"><canvas id="chart"></canvas></div>
            <div class="product-filters" id="filters"></div>
            <div class="status" id="status">데이터 로딩 중...</div>
            <div class="legend-note">점선: 알림 기준선 (소 7,000원 / 돼 2,000원). 호버하면 상세 가격이 나옵니다.</div>
        </div>
    </div>

    <script>
        const CSV_URL = 'https://raw.githubusercontent.com/pyw31337/meat/main/history/prices.csv';
        let rawData = [];
        let chart = null;
        let selectedDays = 0;
        let selectedType = 'all';
        let visibleProducts = new Set();

        async function loadData() {
            const status = document.getElementById('status');
            try {
                const res = await fetch(CSV_URL + '?t=' + Date.now());
                if (!res.ok) throw new Error('CSV 로드 실패');
                const text = await res.text();
                const lines = text.trim().split(/\r?\n/);
                const header = lines[0].split(',');
                rawData = lines.slice(1).map(line => {
                    const parts = line.split(',');
                    return {
                        date: parts[0],
                        product: parts[1],
                        price: parseInt(parts[2], 10)
                    };
                }).filter(d => d.date && !isNaN(d.price));
                status.textContent = `로드 완료: ${rawData.length}건 · 기간 ${rawData[0]?.date || '-'} ~ ${rawData[rawData.length-1]?.date || '-'}`;
                buildFilters();
                renderChart();
            } catch (e) {
                status.textContent = '데이터 로드 실패: ' + e.message;
                console.error(e);
            }
        }

        function buildFilters() {
            const products = [...new Set(rawData.map(d => d.product))].sort();
            const container = document.getElementById('filters');
            container.innerHTML = '';
            visibleProducts = new Set(products);
            products.forEach(p => {
                const chip = document.createElement('label');
                chip.className = 'chip active';
                const short = p.replace(' (국내산) 100g','').replace('구이용','');
                chip.innerHTML = `<input type="checkbox" checked data-product="${p}"><span>${short}</span>`;
                chip.querySelector('input').addEventListener('change', (e) => {
                    if (e.target.checked) visibleProducts.add(p);
                    else visibleProducts.delete(p);
                    chip.classList.toggle('active', e.target.checked);
                    renderChart();
                });
                container.appendChild(chip);
            });
        }

        function getFiltered() {
            let data = rawData.filter(d => visibleProducts.has(d.product));
            if (selectedType === 'beef') data = data.filter(d => !d.product.includes('삼겹살'));
            if (selectedType === 'pork') data = data.filter(d => d.product.includes('삼겹살'));
            if (selectedDays > 0) {
                const cutoff = new Date();
                cutoff.setDate(cutoff.getDate() - selectedDays);
                const cutStr = cutoff.toISOString().slice(0,10);
                data = data.filter(d => d.date >= cutStr);
            }
            return data;
        }

        function renderChart() {
            const data = getFiltered();
            const products = [...new Set(data.map(d => d.product))];
            const dates = [...new Set(data.map(d => d.date))].sort();

            const colors = [
                '#58a6ff','#f85149','#3fb950','#d29922','#bc8cff',
                '#79c0ff','#ffa657','#56d364','#e3b341','#b392f0'
            ];

            const datasets = products.map((p, i) => {
                const map = new Map(data.filter(d => d.product === p).map(d => [d.date, d.price]));
                return {
                    label: p.replace(' (국내산) 100g','').replace('구이용',''),
                    data: dates.map(d => map.has(d) ? map.get(d) : null),
                    borderColor: colors[i % colors.length],
                    backgroundColor: colors[i % colors.length] + '22',
                    tension: 0.25,
                    spanGaps: true,
                    pointRadius: 3,
                    borderWidth: 2
                };
            });

            if (chart) chart.destroy();
            const ctx = document.getElementById('chart').getContext('2d');
            chart = new Chart(ctx, {
                type: 'line',
                data: { labels: dates, datasets },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    interaction: { mode: 'index', intersect: false },
                    plugins: {
                        legend: { position: 'bottom', labels: { boxWidth: 12, padding: 12, color: '#e6edf3' } },
                        tooltip: {
                            callbacks: {
                                label: (ctx) => ctx.dataset.label + ': ' + (ctx.parsed.y ? ctx.parsed.y.toLocaleString() + '원' : '-')
                            }
                        }
                    },
                    scales: {
                        x: { ticks: { color: '#8b949e', maxRotation: 45 }, grid: { color: '#30363d' } },
                        y: {
                            ticks: { color: '#8b949e', callback: v => v.toLocaleString() },
                            grid: { color: '#30363d' },
                            title: { display: true, text: '원 / 100g', color: '#8b949e' }
                        }
                    }
                }
            });
        }

        document.querySelectorAll('[data-days]').forEach(btn => {
            btn.addEventListener('click', () => {
                document.querySelectorAll('[data-days]').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                selectedDays = parseInt(btn.dataset.days, 10);
                renderChart();
            });
        });
        document.querySelectorAll('[data-type]').forEach(btn => {
            btn.addEventListener('click', () => {
                document.querySelectorAll('[data-type]').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                selectedType = btn.dataset.type;
                renderChart();
            });
        });

        loadData();
    </script>
</body>
</html>
