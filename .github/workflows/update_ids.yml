name: Update Product IDs
on:
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * *'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          pip install selenium
          sudo apt-get update && sudo apt-get install -y chromium-browser chromium-chromedriver || true
      - name: Update product IDs
        run: python3 update_product_ids.py || echo "Script completed with warnings"
      - name: Commit mapping
        run: |
          git config user.name "pyw31337"
          git config user.email "pyw213@naver.com"
          git add history/product_ids.json || true
          git diff --staged --quiet || git commit -m "data: update product ID mapping"
          git push || true
