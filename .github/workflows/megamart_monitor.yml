name: Megamart Price Monitor

on:
  schedule:
    # 07:00 KST (22:00 UTC previous day)
    - cron: '0 22 * * *'
    # 09:00 KST (00:00 UTC)
    - cron: '0 0 * * *'
    # 12:00 KST (03:00 UTC)
    - cron: '0 3 * * *'
    # 16:00 KST (07:00 UTC)
    - cron: '0 7 * * *'
    # 20:00 KST (11:00 UTC)
    - cron: '0 11 * * *'
  workflow_dispatch:

jobs:
  monitor:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run price collector
      env:
        RECEIVER_EMAIL: ${{ secrets.RECEIVER_EMAIL }}
        NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
      run: python megamart_checker.py

    - name: Commit price history
      run: |
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"
        git add history/prices.csv history/last_alert_sent.txt
        git diff --staged --quiet || git commit -m "data: update daily price history"
        git push origin main
