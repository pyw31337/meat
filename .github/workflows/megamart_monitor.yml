name: Megamart Price Monitor

on:
  schedule:
    # 07:00 KST (22:00 UTC previous day)
    - cron: '0 22 * * *'
    # 09:00 KST (00:00 UTC)
    - cron: '0 0 * * *'
    # 12:00 KST (03:00 UTC)
    - cron: '0 3 * * *'
    # 16:00 KST (07:00 UTC)
    - cron: '0 7 * * *'
    # 20:00 KST (11:00 UTC)
    - cron: '0 11 * * *'
  workflow_dispatch:

jobs:
  monitor:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run price collector
      env:
        RECEIVER_EMAIL: ${{ secrets.RECEIVER_EMAIL }}
        NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        WEB_PUSH_DISPATCH_URL: ${{ secrets.WEB_PUSH_DISPATCH_URL }}
        WEB_PUSH_DISPATCH_TOKEN: ${{ secrets.WEB_PUSH_DISPATCH_TOKEN }}
      run: python megamart_checker.py

    - name: Commit price history
      run: |
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"
        git add history/prices.csv history/last_alert_sent.txt history/notification_status.json
        git diff --staged --quiet || git commit -m "data: update daily price history"
        git push origin main

    - name: Surface notification health
      if: always()
      run: |
        if [ -f history/notification_status.json ]; then
          status=$(python -c 'import json; from pathlib import Path; print(json.loads(Path("history/notification_status.json").read_text())["status"])')
          if [ "$status" = "failed" ]; then
            echo "::error title=Price alert delivery failed::The collector found eligible prices, but every configured notification channel failed. Check RECEIVER_EMAIL/NTFY_TOPIC/WEB_PUSH_DISPATCH_URL secrets."
          else
            echo "Notification health: $status"
          fi
        else
          echo "::warning title=Notification status missing::The collector did not write history/notification_status.json"
        fi

    - name: Publish observability ledger
      if: always()
      run: python scripts/record_observability.py

    - name: Commit observability ledger
      if: always()
      run: |
        git add data/observability/latest.json
        git diff --staged --quiet || (git commit -m "chore(ops): publish meat observability ledger [skip ci]" && git push origin main)
