name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  # GitHub-token pushes made by the scheduled price collector do not start a
  # second workflow. Deploy after a successful collector run as well.
  workflow_run:
    workflows: ["Megamart Price Monitor"]
    types: [completed]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    if: >-
      ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20.19.0'
          cache: npm

      - name: Build dashboard
        env:
          VITE_PUSH_SUBSCRIBE_URL: ${{ secrets.VITE_PUSH_SUBSCRIBE_URL }}
          VITE_PUSH_VAPID_PUBLIC_KEY: ${{ secrets.VITE_PUSH_VAPID_PUBLIC_KEY }}
        run: |
          npm ci
          npm run test
          npm run build
          mkdir -p dist/history
          cp history/prices.csv dist/history/prices.csv

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'dist'

      # The Pages artifact is eventually consistent in the Actions API. A
      # workflow_run deployment can otherwise race artifact registration and
      # deploy-pages may report that github-pages was not found.
      - name: Allow artifact registration
        run: sleep 12

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
