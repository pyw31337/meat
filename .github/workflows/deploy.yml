name: Deploy Clean
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Write clean dashboard
        run: |
          cat > index.html << 'EOF'
<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>메가마트 한우·삼겹살 가격</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<style>
:root {
  --bg: #f8fafc;
  --card: #ffffff;
  --text: #0f172a;
  --muted: #64748b;
  --border: #e2e8f0;
  --beef: #dc2626;
  --beef-soft: #fef2f2;
  --pork: #2563eb;
  --pork-soft: #eff6ff;
  --up: #ef4444;
  --down: #22c55e;
}
* { box-sizing: border-box; }
body {
  margin: 0;
  font-family: 'Noto Sans KR', system-ui, sans-serif;
  background: var(--bg);
  color: var(--text);
}
.container { max-width: 1400px; margin: 0 auto; padding: 24px 20px 48px; }
header { margin-bottom: 24px; }
h1 { font-size: 1.5rem; font-weight: 700; margin: 0 0 4px; letter-spacing: -0.02em; }
.subtitle { color: var(--muted); font-size: 0.85rem; }
.summary {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
  gap: 12px;
  margin-bottom: 20px;
}
.summary-card {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 14px 16px;
  display: flex;
  flex-direction: column;
  gap: 6px;
}
.summary-card.beef { border-top: 3px solid var(--beef); }
.summary-card.pork { border-top: 3px solid var(--pork); }
.card-top { display: flex; align-items: center; gap: 8px; }
.icon { font-size: 1.1rem; }
.card-name { font-size: 0.82rem; font-weight: 500; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.card-price { font-size: 1.35rem; font-weight: 700; letter-spacing: -0.02em; }
.card-change { font-size: 0.78rem; font-weight: 500; }
.card-change.up { color: var(--up); }
.card-change.down { color: var(--down); }
.card-change.flat { color: var(--muted); }
.controls { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 16px; }
.btn-group { display: flex; gap: 4px; }
button {
  background: var(--card);
  color: var(--text);
  border: 1px solid var(--border);
  padding: 7px 14px;
  border-radius: 8px;
  cursor: pointer;
  font-family: inherit;
  font-size: 0.82rem;
  font-weight: 500;
  transition: all 0.15s;
}
button:hover { border-color: #94a3b8; }
button.active { background: var(--text); color: #fff; border-color: var(--text); }
button.beef.active { background: var(--beef); border-color: var(--beef); }
button.pork.active { background: var(--pork); border-color: var(--pork); }
.chart-card {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 16px;
  padding: 20px;
  margin-bottom: 20px;
}
.chart-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; }
.chart-header h2 { margin: 0; font-size: 1rem; font-weight: 600; }
.legend-inline { display: flex; gap: 16px; font-size: 0.78rem; color: var(--muted); }
.legend-inline span { display: flex; align-items: center; gap: 5px; }
.dot { width: 8px; height: 8px; border-radius: 50%; }
.dot.beef { background: var(--beef); }
.dot.pork { background: var(--pork); }
.chart-wrap { position: relative; height: 480px; }
.filters {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
  margin-top: 16px;
  padding-top: 16px;
  border-top: 1px solid var(--border);
}
.chip {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  background: #f1f5f9;
  border: 1px solid transparent;
  padding: 5px 12px;
  border-radius: 20px;
  font-size: 0.78rem;
  cursor: pointer;
  font-weight: 500;
}
.chip.active { background: var(--text); color: #fff; }
.chip.beef.active { background: var(--beef); }
.chip.pork.active { background: var(--pork); }
.analysis {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
  gap: 12px;
}
.analysis-item {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 14px 16px;
}
.analysis-item.beef { border-left: 3px solid var(--beef); }
.analysis-item.pork { border-left: 3px solid var(--pork); }
.analysis-item h3 {
  margin: 0 0 10px;
  font-size: 0.85rem;
  font-weight: 600;
  display: flex;
  align-items: center;
  gap: 6px;
}
.metrics {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 8px 16px;
}
.metric { display: flex; flex-direction: column; gap: 2px; }
.metric-label { font-size: 0.72rem; color: var(--muted); }
.metric-value { font-size: 0.9rem; font-weight: 600; }
.metric-value.up { color: var(--up); }
.metric-value.down { color: var(--down); }
.status { font-size: 0.75rem; color: var(--muted); margin-top: 12px; }
footer { text-align: center; color: var(--muted); font-size: 0.75rem; margin-top: 24px; }
footer a { color: var(--pork); text-decoration: none; }
</style>
</head>
<body>
<div class="container">
  <header>
    <h1>메가마트 가격 추이</h1>
    <div class="subtitle">한우 등심 · 삼겹살 · 100g당</div>
  </header>
  <div class="summary" id="summary"></div>
  <div class="controls">
    <div class="btn-group">
      <button data-days="7">7일</button>
      <button data-days="30">30일</button>
      <button data-days="90">90일</button>
      <button data-days="0" class="active">전체</button>
    </div>
    <div class="btn-group">
      <button data-unit="day" class="active">일</button>
      <button data-unit="month">월</button>
      <button data-unit="quarter">분기</button>
    </div>
    <div class="btn-group">
      <button data-type="all" class="active">전체</button>
      <button data-type="beef" class="beef">소</button>
      <button data-type="pork" class="pork">돼지</button>
    </div>
  </div>
  <div class="chart-card">
    <div class="chart-header">
      <h2>가격 추이</h2>
      <div class="legend-inline">
        <span><span class="dot beef"></span>소고기</span>
        <span><span class="dot pork"></span>돼지고기</span>
      </div>
    </div>
    <div class="chart-wrap"><canvas id="chart"></canvas></div>
    <div class="filters" id="filters"></div>
    <div class="status" id="status"></div>
  </div>
  <div class="analysis" id="analysis"></div>
  <footer><a href="https://github.com/pyw31337/meat">GitHub</a></footer>
</div>
<script>
const CSV_URL = 'https://raw.githubusercontent.com/pyw31337/meat/main/history/prices.csv';
const WEEKDAYS = ['일','월','화','수','목','금','토'];
function formatDate(iso) {
  const d = new Date(iso + 'T00:00:00');
  if (isNaN(d)) return iso;
  const yy = String(d.getFullYear()).slice(2);
  const mm = String(d.getMonth()+1).padStart(2,'0');
  const dd = String(d.getDate()).padStart(2,'0');
  return yy + '.' + mm + '.' + dd + '(' + WEEKDAYS[d.getDay()] + ')';
}
function isPork(name) { return name.includes('삼겹살'); }
function shortName(name) {
  return name.replace(' (국내산) 100g', '').replace('구이용', '').replace('한우 등심 ', '').replace('돼지 ', '').trim();
}
let rawData = [];
let chart = null;
let selectedDays = 0;
let selectedType = 'all';
let selectedUnit = 'day';
let selectedProduct = null;
const BEEF_COLORS = ['#7f1d1d','#991b1b','#b91c1c','#dc2626','#ef4444','#f87171'];
const PORK_COLORS = ['#1e3a8a','#1e40af','#1d4ed8','#2563eb','#3b82f6','#60a5fa'];
function getColor(product, allProducts) {
  const pork = isPork(product);
  const sameType = allProducts.filter(p => isPork(p) === pork);
  const idx = sameType.indexOf(product);
  const colors = pork ? PORK_COLORS : BEEF_COLORS;
  return colors[idx % colors.length];
}
async function loadData() {
  const status = document.getElementById('status');
  try {
    const res = await fetch(CSV_URL + '?t=' + Date.now());
    if (!res.ok) throw new Error('fail');
    const text = await res.text();
    const lines = text.trim().split(/\r?\n/);
    rawData = lines.slice(1).map(line => {
      const parts = line.split(',');
      return { date: parts[0], product: parts[1], price: parseInt(parts[2], 10) };
    }).filter(d => d.date && !isNaN(d.price));
    status.textContent = rawData.length + '건 · ' + formatDate(rawData[0]?.date) + ' ~ ' + formatDate(rawData[rawData.length-1]?.date);
    buildSummary();
    buildFilters();
    renderChart();
    buildAnalysis();
  } catch (e) {
    status.textContent = '로드 실패';
  }
}
function getProductStats(product) {
  const items = rawData.filter(d => d.product === product).sort((a,b) => a.date.localeCompare(b.date));
  if (items.length === 0) return null;
  const prices = items.map(d => d.price);
  const latest = items[items.length - 1];
  const min = Math.min(...prices);
  const max = Math.max(...prices);
  const avg = Math.round(prices.reduce((a,b) => a+b, 0) / prices.length);
  function priceAt(daysAgo) {
    const cutoff = new Date();
    cutoff.setDate(cutoff.getDate() - daysAgo);
    const cutStr = cutoff.toISOString().slice(0,10);
    const past = items.filter(d => d.date <= cutStr);
    return past.length ? past[past.length - 1].price : null;
  }
  const p7 = priceAt(7);
  const chg7 = p7 != null ? latest.price - p7 : null;
  const pct7 = p7 ? Math.round((chg7 / p7) * 100) : null;
  return { latest, min, max, avg, chg7, pct7, count: items.length };
}
function buildSummary() {
  const container = document.getElementById('summary');
  const products = [...new Set(rawData.map(d => d.product))];
  const sorted = products.sort((a, b) => {
    const aPork = isPork(a), bPork = isPork(b);
    if (aPork !== bPork) return aPork ? 1 : -1;
    const sa = getProductStats(a), sb = getProductStats(b);
    return (sb?.latest.price || 0) - (sa?.latest.price || 0);
  });
  container.innerHTML = sorted.map(p => {
    const pork = isPork(p);
    const s = getProductStats(p);
    if (!s) return '';
    let changeHtml = '';
    if (s.chg7 != null) {
      const cls = s.chg7 > 0 ? 'up' : s.chg7 < 0 ? 'down' : 'flat';
      const sign = s.chg7 > 0 ? '+' : '';
      changeHtml = '<span class="card-change ' + cls + '">' + sign + s.chg7.toLocaleString() + '</span>';
    }
    const icon = pork ? '🐷' : '🐂';
    return '<div class="summary-card ' + (pork ? 'pork' : 'beef') + '">' +
      '<div class="card-top"><span class="icon">' + icon + '</span><span class="card-name">' + shortName(p) + '</span></div>' +
      '<div class="card-price">' + s.latest.price.toLocaleString() + '</div>' +
      '<div>' + changeHtml + '</div>' +
    '</div>';
  }).join('');
}
function buildAnalysis() {
  const container = document.getElementById('analysis');
  const products = [...new Set(rawData.map(d => d.product))];
  const sorted = products.sort((a, b) => {
    const aPork = isPork(a), bPork = isPork(b);
    if (aPork !== bPork) return aPork ? 1 : -1;
    return shortName(a).localeCompare(shortName(b));
  });
  container.innerHTML = sorted.map(p => {
    const pork = isPork(p);
    const s = getProductStats(p);
    if (!s) return '';
    const icon = pork ? '🐷' : '🐂';
    function fmtChg(v, pct) {
      if (v == null) return '-';
      const cls = v > 0 ? 'up' : v < 0 ? 'down' : '';
      const sign = v > 0 ? '+' : '';
      return '<span class="metric-value ' + cls + '">' + sign + v.toLocaleString() + (pct != null ? ' (' + sign + pct + '%)' : '') + '</span>';
    }
    return '<div class="analysis-item ' + (pork ? 'pork' : 'beef') + '">' +
      '<h3>' + icon + ' ' + shortName(p) + '</h3>' +
      '<div class="metrics">' +
        '<div class="metric"><span class="metric-label">현재</span><span class="metric-value">' + s.latest.price.toLocaleString() + '</span></div>' +
        '<div class="metric"><span class="metric-label">7일</span>' + fmtChg(s.chg7, s.pct7) + '</div>' +
        '<div class="metric"><span class="metric-label">최저</span><span class="metric-value">' + s.min.toLocaleString() + '</span></div>' +
        '<div class="metric"><span class="metric-label">최고</span><span class="metric-value">' + s.max.toLocaleString() + '</span></div>' +
        '<div class="metric"><span class="metric-label">평균</span><span class="metric-value">' + s.avg.toLocaleString() + '</span></div>' +
        '<div class="metric"><span class="metric-label">일수</span><span class="metric-value">' + s.count + '</span></div>' +
      '</div>' +
    '</div>';
  }).join('');
}
function buildFilters() {
  const products = [...new Set(rawData.map(d => d.product))].sort((a,b) => isPork(a) - isPork(b));
  const container = document.getElementById('filters');
  container.innerHTML = '';
  const allChip = document.createElement('label');
  allChip.className = 'chip active';
  allChip.innerHTML = '전체';
  allChip.addEventListener('click', () => {
    selectedProduct = null;
    updateChipStates();
    renderChart();
  });
  container.appendChild(allChip);
  products.forEach(p => {
    const pork = isPork(p);
    const chip = document.createElement('label');
    chip.className = 'chip ' + (pork ? 'pork' : 'beef');
    chip.dataset.product = p;
    chip.innerHTML = shortName(p);
    chip.addEventListener('click', () => {
      selectedProduct = p;
      updateChipStates();
      renderChart();
    });
    container.appendChild(chip);
  });
}
function updateChipStates() {
  document.querySelectorAll('.chip').forEach(chip => {
    const isAll = !chip.dataset.product;
    const isSelected = selectedProduct === null ? isAll : chip.dataset.product === selectedProduct;
    chip.classList.toggle('active', isSelected);
  });
}
function getFiltered() {
  let data = rawData;
  if (selectedProduct) {
    data = data.filter(d => d.product === selectedProduct);
  } else {
    if (selectedType === 'beef') data = data.filter(d => !isPork(d.product));
    if (selectedType === 'pork') data = data.filter(d => isPork(d.product));
  }
  if (selectedDays > 0) {
    const cutoff = new Date();
    cutoff.setDate(cutoff.getDate() - selectedDays);
    const cutStr = cutoff.toISOString().slice(0,10);
    data = data.filter(d => d.date >= cutStr);
  }
  return data;
}
function groupKey(date, unit) {
  if (unit === 'day') return date;
  if (unit === 'month') return date.slice(0, 7);
  if (unit === 'quarter') {
    const [y, m] = date.split('-');
    const q = Math.ceil(parseInt(m, 10) / 3);
    return y + '-Q' + q;
  }
  return date;
}
function formatGroupLabel(key, unit) {
  if (unit === 'day') return formatDate(key);
  if (unit === 'month') {
    const [y, m] = key.split('-');
    return y.slice(2) + '.' + m;
  }
  if (unit === 'quarter') return key.replace('-', ' ');
  return key;
}
function renderChart() {
  const data = getFiltered();
  const allProducts = [...new Set(rawData.map(d => d.product))];
  const products = [...new Set(data.map(d => d.product))];
  const groups = [...new Set(data.map(d => groupKey(d.date, selectedUnit)))].sort();
  const labels = groups.map(g => formatGroupLabel(g, selectedUnit));
  const datasets = products.map(p => {
    const color = getColor(p, allProducts);
    const pork = isPork(p);
    const productData = data.filter(d => d.product === p);
    const groupMap = new Map();
    productData.forEach(d => {
      const g = groupKey(d.date, selectedUnit);
      if (!groupMap.has(g)) groupMap.set(g, []);
      groupMap.get(g).push(d.price);
    });
    const values = groups.map(g => {
      const prices = groupMap.get(g);
      if (!prices || prices.length === 0) return null;
      return Math.round(prices.reduce((a,b) => a+b, 0) / prices.length);
    });
    return {
      label: shortName(p),
      data: values,
      borderColor: color,
      backgroundColor: color + '15',
      tension: 0.3,
      spanGaps: true,
      pointRadius: 2,
      pointHoverRadius: 5,
      borderWidth: 2,
      borderDash: pork ? [4, 3] : []
    };
  });
  if (chart) chart.destroy();
  const ctx = document.getElementById('chart').getContext('2d');
  chart = new Chart(ctx, {
    type: 'line',
    data: { labels, datasets },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      interaction: { mode: 'index', intersect: false },
      plugins: {
        legend: { display: false },
        tooltip: {
          backgroundColor: 'rgba(15, 23, 42, 0.95)',
          titleFont: { size: 12, family: "'Noto Sans KR', sans-serif" },
          bodyFont: { size: 11, family: "'Noto Sans KR', sans-serif" },
          padding: 10,
          cornerRadius: 6,
          callbacks: {
            label: (ctx) => ' ' + ctx.dataset.label + ': ' + (ctx.parsed.y ? ctx.parsed.y.toLocaleString() + '원' : '-')
          }
        }
      },
      scales: {
        x: {
          ticks: { color: '#94a3b8', maxRotation: 0, font: { size: 10 } },
          grid: { display: false },
          border: { display: false }
        },
        y: {
          ticks: { color: '#94a3b8', font: { size: 10 }, callback: v => (v/1000) + 'k' },
          grid: { color: '#f1f5f9' },
          border: { display: false }
        }
      }
    }
  });
}
document.querySelectorAll('[data-days]').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('[data-days]').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    selectedDays = parseInt(btn.dataset.days, 10);
    renderChart();
  });
});
document.querySelectorAll('[data-unit]').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('[data-unit]').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    selectedUnit = btn.dataset.unit;
    renderChart();
  });
});
document.querySelectorAll('[data-type]').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('[data-type]').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    selectedType = btn.dataset.type;
    selectedProduct = null;
    updateChipStates();
    renderChart();
  });
});
loadData();
</script>
</body>
</html>
