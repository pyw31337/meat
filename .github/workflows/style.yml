name: Style Chart
on:
  workflow_dispatch:
  push:
    paths:
      - 'patch_style.py'
permissions:
  contents: write
jobs:
  style:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run patch
        run: |
          python3 patch_style.py
          git config user.name "pyw31337"
          git config user.email "pyw213@naver.com"
          git add index.html
          git commit -m "style: polish chart styles" || true
          git push
