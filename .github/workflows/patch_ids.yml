permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch checker
        run: |
          python3 << 'PY'
          from pathlib import Path
          p = Path('megamart_checker.py')
          c = p.read_text(encoding='utf-8')
          
          # Update scraping to extract product ID
          old = '''price_per_100g = int((price_value / weight) * 100) if weight > 0 else 0
                
                monitored_products.append((normalized_title, price_per_100g, price_value, weight))
                logging.info(f"Monitored item: '{title_text}' (normalized: '{normalized_title}') -> {price_value:,}원 ({weight}g) | 100g당 {price_per_100g:,}원")
                
                if price_per_100g <= threshold:
                    cheap_products.append((normalized_title, price_per_100g, price_value, weight))'''
          new = '''price_per_100g = int((price_value / weight) * 100) if weight > 0 else 0
                
                # Extract product ID from onclick
                product_id = None
                try:
                    link_el = item.find_element(By.CSS_SELECTOR, "a.link")
                    onclick = link_el.get_attribute("onclick") or ""
                    id_match = re.search(r"goDetail\\('(\\d+)'\\)", onclick)
                    if id_match:
                        product_id = id_match.group(1)
                except Exception:
                    pass
                
                monitored_products.append((normalized_title, price_per_100g, price_value, weight, product_id))
                logging.info(f"Monitored item: '{title_text}' (normalized: '{normalized_title}', id: {product_id}) -> {price_value:,}원 ({weight}g) | 100g당 {price_per_100g:,}원")
                
                if price_per_100g <= threshold:
                    cheap_products.append((normalized_title, price_per_100g, price_value, weight, product_id))'''
          if old in c:
              c = c.replace(old, new)
              print('scrape patched')
          else:
              print('scrape not found')
          
          # Update CSV save to also save mapping
          old2 = '''for name, price_per_100g, actual_price, weight in products:
                if (today_str, name) not in existing_entries:
                    writer.writerow([today_str, name, price_per_100g])
                    logging.info(f"Saved history: {today_str}, {name}, 100g당 {price_per_100g}원")'''
          new2 = '''for item in products:
                name, price_per_100g = item[0], item[1]
                product_id = item[4] if len(item) > 4 else None
                if (today_str, name) not in existing_entries:
                    writer.writerow([today_str, name, price_per_100g])
                    logging.info(f"Saved history: {today_str}, {name}, 100g당 {price_per_100g}원")
    
    # Save product ID mapping
    try:
        import json
        mapping_path = "history/product_ids.json"
        mapping = {}
        if os.path.exists(mapping_path):
            with open(mapping_path, "r", encoding="utf-8") as f:
                mapping = json.load(f)
        for item in products:
            name = item[0]
            product_id = item[4] if len(item) > 4 else None
            if product_id:
                mapping[name] = product_id
        with open(mapping_path, "w", encoding="utf-8") as f:
            json.dump(mapping, f, ensure_ascii=False, indent=2)
        logging.info(f"Saved product ID mapping: {len(mapping)} products")
    except Exception as e:
        logging.error(f"Failed to save product ID mapping: {e}")'''
          if old2 in c:
