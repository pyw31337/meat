<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#ffffff">
<title>메가마트 가격</title>
<meta name="description" content="메가마트 한우 등심과 삼겹살 가격을 추적합니다. 100g당 가격 비교와 알림.">
<meta property="og:title" content="메가마트 가격">
<meta property="og:description" content="한우 · 삼겹살 가격 추적">
<meta property="og:image" content="https://pyw31337.github.io/meat/og-meat.png">
<meta property="og:url" content="https://pyw31337.github.io/meat/">
<meta property="og:type" content="website">
<link rel="icon" href="favicon.ico">
<link rel="apple-touch-icon" href="favicon-192.png">
<link rel="manifest" href="manifest.json">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<style>
:root {
  --bg: #f8fafc; --card: #ffffff; --text: #0f172a; --muted: #64748b; --border: #e2e8f0;
  --beef: #dc2626; --pork: #2563eb; --up: #ef4444; --down: #22c55e; --ma7: #f59e0b; --ma30: #8b5cf6;
}
* { box-sizing: border-box; }
body { margin: 0; font-family: 'Noto Sans KR', system-ui, sans-serif; background: var(--bg); color: var(--text); line-height: 1.4; padding-top: env(safe-area-inset-top); padding-bottom: env(safe-area-inset-bottom); }
.container { max-width: 1280px; margin: 0 auto; padding: 20px 16px 40px; padding-left: max(16px, env(safe-area-inset-left)); padding-right: max(16px, env(safe-area-inset-right)); }
header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 16px; flex-wrap: wrap; gap: 8px; }
.header-left h1 { font-size: 1.4rem; font-weight: 700; margin: 0 0 2px; }
.header-actions { display: flex; gap: 6px; flex-wrap: wrap; }
.header-btn { display: inline-flex; align-items: center; gap: 4px; padding: 6px 12px; background: #0f172a; color: #fff; border-radius: 6px; font-size: 0.75rem; text-decoration: none; border: none; cursor: pointer; font-family: inherit; }
.header-btn.secondary { background: #fff; color: #0f172a; border: 1px solid var(--border); }
.subtitle { color: var(--muted); font-size: 0.8rem; }
.alert-info { color: var(--muted); font-size: 0.7rem; margin-top: 4px; }
.controls { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 12px; }
.btn-group { display: flex; background: var(--card); border: 1px solid var(--border); border-radius: 8px; overflow: hidden; }
button { background: transparent; color: var(--muted); border: none; padding: 6px 12px; cursor: pointer; font-family: inherit; font-size: 0.78rem; }
button.active { background: var(--text); color: #fff; }
button.beef.active { background: var(--beef); }
button.pork.active { background: var(--pork); }
.chart-card { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 16px; margin-bottom: 16px; }
.chart-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
.chart-header h2 { margin: 0; font-size: 0.9rem; }
.legend { display: flex; gap: 12px; font-size: 0.72rem; color: var(--muted); }
.legend span { display: flex; align-items: center; gap: 4px; }
.dot { width: 8px; height: 8px; border-radius: 50%; }
.dot.beef { background: var(--beef); } .dot.pork { background: var(--pork); } .dot.ma7 { background: var(--ma7); } .dot.ma30 { background: var(--ma30); }
.chart-wrap { position: relative; height: 460px; }
.status { font-size: 0.7rem; color: var(--muted); margin-top: 8px; }
.products { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 10px; }
.product-card { background: var(--card); border: 1px solid var(--border); border-radius: 10px; padding: 12px 14px; cursor: pointer; }
.product-card:hover { border-color: #94a3b8; }
.product-card.active { box-shadow: 0 0 0 2px var(--text); }
.product-card.beef { border-top: 3px solid var(--beef); }
.product-card.pork { border-top: 3px solid var(--pork); }
.product-card.beef.active { box-shadow: 0 0 0 2px var(--beef); }
.product-card.pork.active { box-shadow: 0 0 0 2px var(--pork); }
.product-card.cheaper {
  animation: shake-pause 2.4s ease-in-out infinite;
}
@keyframes shake-pause {
  0%, 10% { transform: translateX(0); }
  2% { transform: translateX(-3px); }
  4% { transform: translateX(3px); }
  6% { transform: translateX(-2px); }
  8% { transform: translateX(2px); }
  10%, 50% { transform: translateX(0); }
  52% { transform: translateX(-3px); }
  54% { transform: translateX(3px); }
  56% { transform: translateX(-2px); }
  58% { transform: translateX(2px); }
  60%, 100% { transform: translateX(0); }
}
.pc-name { font-size: 0.75rem; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-bottom: 4px; }
.pc-price { font-size: 1.3rem; font-weight: 700; }
.pc-change { font-size: 0.72rem; font-weight: 500; margin-top: 2px; }
.pc-change.up { color: var(--up); } .pc-change.down { color: var(--down); }
.sparkline { position: relative; margin: 6px 0; cursor: crosshair; }
.sparkline canvas { width: 100%; height: 32px; display: block; }
.spark-labels { display: flex; justify-content: space-between; font-size: 0.6rem; color: #94a3b8; margin-top: 2px; padding: 0 2px; }
.spark-tooltip {
  position: absolute; background: #0f172a; color: #fff; font-size: 0.68rem;
  padding: 3px 6px; border-radius: 4px; pointer-events: none; white-space: nowrap;
  transform: translate(-50%, -100%); opacity: 0; transition: opacity 0.1s; z-index: 10;
}
.spark-tooltip.visible { opacity: 1; }
.spark-vs-avg { position: absolute; right: 0; top: -2px; font-size: 0.6rem; font-weight: 600; pointer-events: none; }
.spark-vs-avg.up { color: var(--up); } .spark-vs-avg.down { color: var(--down); }
.pc-metrics { display: grid; grid-template-columns: 1fr 1fr; gap: 4px 10px; margin-top: 8px; padding-top: 8px; border-top: 1px solid var(--border); font-size: 0.7rem; }
.pc-metric-label { color: var(--muted); } .pc-metric-value { font-weight: 600; }
.buy-btn { display: block; margin-top: 10px; padding: 6px 0; background: #0f172a; color: #fff; text-align: center; border-radius: 6px; font-size: 0.75rem; text-decoration: none; }
.product-card.beef .buy-btn { background: var(--beef); } .product-card.pork .buy-btn { background: var(--pork); }
footer { text-align: center; color: var(--muted); font-size: 0.7rem; margin-top: 20px; }
@media (max-width: 480px) {
  .header-left h1 { font-size: 1.1rem; }
  .header-btn { padding: 5px 8px; font-size: 0.7rem; }
  .chart-wrap { height: 280px; }
  .product-grid { grid-template-columns: 1fr !important; }
}
@media (max-width: 320px) {
  .container { padding: 12px 8px 32px; }
  .header-actions { width: 100%; }
  .header-btn { flex: 1; justify-content: center; }
}
footer a { color: var(--pork); text-decoration: none; }
</style>
</head>
<body>
<div class="container">
  <header>
    <div class="header-left">
      <h1>메가마트 가격</h1>
      <div class="subtitle">한우 등심 · 삼겹살 · 100g당</div>
      <div class="alert-info">삼겹살 100g당 1,700원 이하 · 한우 100g당 7,000원 이하일 때 알림</div>
    </div>
    <div class="header-actions">
      <a class="header-btn" href="https://www.megamart.com/" target="_blank" rel="noopener">메가마트 가기</a>
      <button class="header-btn secondary" id="shareBtn">공유</button>
      <button class="header-btn secondary" id="notifyBtn">알림설정</button>
    </div>
  </header>
  <div class="controls">
    <div class="btn-group">
      <button data-days="7">7일</button><button data-days="30">30일</button><button data-days="90">90일</button><button data-days="0" class="active">전체</button>
    </div>
    <div class="btn-group">
      <button data-unit="day" class="active">일</button><button data-unit="month">월</button><button data-unit="quarter">분기</button>
    </div>
    <div class="btn-group">
      <button data-type="all" class="active">전체</button><button data-type="beef" class="beef">소</button><button data-type="pork" class="pork">돼지</button>
    </div>
  </div>
  <div class="chart-card">
    <div class="chart-header">
      <h2>가격 추이</h2>
      <div class="legend">
        <span><span class="dot beef"></span>소고기</span>
        <span><span class="dot pork"></span>돼지고기</span>
        <span><span class="dot ma7"></span>MA7</span>
        <span><span class="dot ma30"></span>MA30</span>
      </div>
    </div>
    <div class="chart-wrap"><canvas id="chart"></canvas></div>
    <div class="status" id="status"></div>
  </div>
  <div class="products" id="products"></div>
  <footer><a href="https://github.com/pyw31337/meat">GitHub</a></footer>
</div>
<script>
const CSV_URL = 'https://raw.githubusercontent.com/pyw31337/meat/main/history/prices.csv';
const IDS_URL = 'https://raw.githubusercontent.com/pyw31337/meat/main/history/product_ids.json';
const WEEKDAYS = ['일','월','화','수','목','금','토'];
const BEEF_SEARCH = 'https://www.megamart.com/search/?text=' + encodeURIComponent('한우 등심');
const PORK_SEARCH = 'https://www.megamart.com/search/?text=' + encodeURIComponent('삼겹살 국내산');
function formatDate(iso) {
  const d = new Date(iso + 'T00:00:00');
  if (isNaN(d)) return iso;
  const yy = String(d.getFullYear()).slice(2);
  const mm = String(d.getMonth()+1).padStart(2,'0');
  const dd = String(d.getDate()).padStart(2,'0');
  return yy + '.' + mm + '.' + dd + '(' + WEEKDAYS[d.getDay()] + ')';
}
function isPork(name) { return name.includes('삼겹살'); }
function shortName(name) {
  return name.replace(' (국내산) 100g','').replace('구이용','').replace('한우 등심 ','').replace('돼지 ','').trim();
}
let rawData = [], chart = null, productIds = {};
let selectedDays = 0, selectedType = 'all', selectedUnit = 'day', focusedProduct = null;
const BEEF_COLORS = ['#7f1d1d','#991b1b','#b91c1c','#dc2626','#ef4444','#f87171'];
const PORK_COLORS = ['#1e3a8a','#1e40af','#1d4ed8','#2563eb','#3b82f6','#60a5fa'];
function getColor(product, all) {
  const pork = isPork(product);
  const same = all.filter(p => isPork(p) === pork);
  return (pork ? PORK_COLORS : BEEF_COLORS)[same.indexOf(product) % 6];
}
function calcMA(values, period) {
  const result = [];
  for (let i = 0; i < values.length; i++) {
    if (i < period - 1 || values[i] == null) { result.push(null); continue; }
    let sum = 0, count = 0;
    for (let j = 0; j < period; j++) { if (values[i - j] != null) { sum += values[i - j]; count++; } }
    result.push(count === period ? Math.round(sum / period) : null);
  }
  return result;
}
async function loadData() {
  const status = document.getElementById('status');
  try {
    const idsRes = await fetch(IDS_URL + '?t=' + Date.now());
    if (idsRes.ok) productIds = await idsRes.json();
    const res = await fetch(CSV_URL + '?t=' + Date.now());
    const text = await res.text();
    const lines = text.trim().split(/\r?\n/);
    rawData = lines.slice(1).map(l => {
      const p = l.split(',');
      return { date: p[0], product: p[1], price: parseInt(p[2], 10) };
    }).filter(d => d.date && !isNaN(d.price));
    status.textContent = rawData.length + '건 · ' + formatDate(rawData[0]?.date) + ' ~ ' + formatDate(rawData[rawData.length-1]?.date);
    buildProducts();
    renderChart();
  } catch (e) { status.textContent = '로드 실패'; }
}
function getStats(product) {
  const items = rawData.filter(d => d.product === product).sort((a,b) => a.date.localeCompare(b.date));
  if (!items.length) return null;
  const prices = items.map(d => d.price);
  const latest = items[items.length - 1];
  const min = Math.min(...prices), max = Math.max(...prices);
  const avg = Math.round(prices.reduce((a,b) => a+b, 0) / prices.length);
  const cutoff = new Date(); cutoff.setDate(cutoff.getDate() - 7);
  const cutStr = cutoff.toISOString().slice(0,10);
  const past = items.filter(d => d.date <= cutStr);
  const p7 = past.length ? past[past.length - 1].price : null;
  const chg7 = p7 != null ? latest.price - p7 : null;
  const pct7 = p7 ? Math.round((chg7 / p7) * 100) : null;
  const yesterday = items.length >= 2 ? items[items.length - 2] : null;
  const chg1 = yesterday ? latest.price - yesterday.price : null;
  return { latest, min, max, avg, chg7, pct7, chg1, count: items.length };
}
function buildProducts() {
  const products = [...new Set(rawData.map(d => d.product))];
  const sorted = products.sort((a,b) => {
    if (isPork(a) !== isPork(b)) return isPork(a) ? 1 : -1;
    return (getStats(b)?.latest.price || 0) - (getStats(a)?.latest.price || 0);
  });
  document.getElementById('products').innerHTML = sorted.map(p => {
    const pork = isPork(p), s = getStats(p);
    if (!s) return '';
    let chg = '';
    if (s.chg7 != null) {
      const cls = s.chg7 > 0 ? 'up' : s.chg7 < 0 ? 'down' : '';
      const sign = s.chg7 > 0 ? '+' : '';
      chg = '<div class="pc-change ' + cls + '">' + sign + s.chg7.toLocaleString() + (s.pct7 ? ' (' + sign + s.pct7 + '%)' : '') + '</div>';
    }
    const active = focusedProduct === p ? ' active' : '';
    const cheaper = s.chg1 != null && s.chg1 < 0 ? ' cheaper' : '';
    const pid = productIds[p];
    const buyUrl = pid ? 'https://www.megamart.com/product/' + pid : (pork ? PORK_SEARCH : BEEF_SEARCH);
    return '<div class="product-card ' + (pork ? 'pork' : 'beef') + active + cheaper + '" data-product="' + p + '">' +
      '<div class="pc-name">' + shortName(p) + '</div>' +
      '<div class="pc-price">' + s.latest.price.toLocaleString() + '</div>' + chg +
      '<div class="sparkline" data-product="' + p + '"></div>' +
      '<div class="pc-metrics">' +
        '<div><span class="pc-metric-label">최저</span> <span class="pc-metric-value">' + s.min.toLocaleString() + '</span></div>' +
        '<div><span class="pc-metric-label">최고</span> <span class="pc-metric-value">' + s.max.toLocaleString() + '</span></div>' +
        '<div><span class="pc-metric-label">평균</span> <span class="pc-metric-value">' + s.avg.toLocaleString() + '</span></div>' +
        '<div><span class="pc-metric-label">일수</span> <span class="pc-metric-value">' + s.count + '</span></div>' +
      '</div>' +
      '<a href="' + buyUrl + '" target="_blank" class="buy-btn" onclick="event.stopPropagation()">구매하러 가기</a>' +
    '</div>';
  }).join('');

  // Render 7-day sparklines with canvas (keeps circles round)
  document.querySelectorAll('.sparkline').forEach(el => {
    const product = el.dataset.product;
    const allItems = rawData.filter(d => d.product === product).sort((a,b) => a.date.localeCompare(b.date));
    if (allItems.length < 2) return;
    const items = allItems.slice(-7);
    const prices = items.map(d => d.price);
    const min = Math.min(...prices), max = Math.max(...prices);
    const range = max - min || 1;
    const avg = Math.round(prices.reduce((a,b) => a+b, 0) / prices.length);
    const latest = prices[prices.length - 1];
    const vsAvg = latest - avg;
    const vsAvgPct = avg ? Math.round((vsAvg / avg) * 100) : 0;
    const color = isPork(product) ? '#2563eb' : '#dc2626';
    const labels = items.map(item => {
      const d = new Date(item.date + 'T00:00:00');
      return '<span>' + WEEKDAYS[d.getDay()] + '</span>';
    }).join('');
    const vsCls = vsAvg > 0 ? 'up' : vsAvg < 0 ? 'down' : '';
    const vsSign = vsAvg > 0 ? '+' : '';
    const vsLabel = vsSign + vsAvgPct + '%';
    el.innerHTML = '<canvas></canvas>' +
      '<div class="spark-labels">' + labels + '</div>' +
      '<div class="spark-vs-avg ' + vsCls + '">' + vsLabel + '</div>' +
      '<div class="spark-tooltip"></div>';
    const canvas = el.querySelector('canvas');
    const dpr = window.devicePixelRatio || 1;
    const cssW = canvas.clientWidth || 160;
    const cssH = 32;
    canvas.width = cssW * dpr;
    canvas.height = cssH * dpr;
    canvas.style.width = cssW + 'px';
    canvas.style.height = cssH + 'px';
    const ctx = canvas.getContext('2d');
    ctx.scale(dpr, dpr);
    const pad = 4;
    const plotW = cssW - pad * 2;
    const plotH = cssH - pad * 2;
    // Average line
    const avgY = pad + plotH - ((avg - min) / range) * plotH;
    ctx.setLineDash([2, 2]);
    ctx.strokeStyle = '#94a3b8';
    ctx.lineWidth = 0.8;
    ctx.beginPath();
    ctx.moveTo(pad, avgY);
    ctx.lineTo(cssW - pad, avgY);
    ctx.stroke();
    ctx.setLineDash([]);
    // Line
    ctx.strokeStyle = color;
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    prices.forEach((pr, i) => {
      const x = pad + (i / Math.max(prices.length - 1, 1)) * plotW;
      const y = pad + plotH - ((pr - min) / range) * plotH;
      if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
    });
    ctx.stroke();
    // Circles
    ctx.fillStyle = color;
    prices.forEach((pr, i) => {
      const x = pad + (i / Math.max(prices.length - 1, 1)) * plotW;
      const y = pad + plotH - ((pr - min) / range) * plotH;
      ctx.beginPath();
      ctx.arc(x, y, 2.5, 0, Math.PI * 2);
      ctx.fill();
    });
    el.onmousemove = (e) => {
      const rect = canvas.getBoundingClientRect();
      const x = e.clientX - rect.left;
      const idx = Math.round(((x - pad) / plotW) * (items.length - 1));
      const clamped = Math.max(0, Math.min(idx, items.length - 1));
      const item = items[clamped];
      const tip = el.querySelector('.spark-tooltip');
      tip.textContent = formatDate(item.date) + ' · ' + item.price.toLocaleString() + '원';
      tip.style.left = x + 'px';
      tip.style.top = '0px';
      tip.classList.add('visible');
    };
    el.onmouseleave = () => el.querySelector('.spark-tooltip').classList.remove('visible');
  });

  document.querySelectorAll('.product-card').forEach(card => {
    card.onclick = () => {
      const p = card.dataset.product;
      focusedProduct = focusedProduct === p ? null : p;
      buildProducts();
      renderChart();
    };
  });
}
function getFiltered() {
  let data = rawData;
  if (selectedType === 'beef') data = data.filter(d => !isPork(d.product));
  if (selectedType === 'pork') data = data.filter(d => isPork(d.product));
  if (selectedDays > 0) {
    const cutoff = new Date(); cutoff.setDate(cutoff.getDate() - selectedDays);
    data = data.filter(d => d.date >= cutoff.toISOString().slice(0,10));
  }
  return data;
}
function groupKey(date, unit) {
  if (unit === 'day') return date;
  if (unit === 'month') return date.slice(0, 7);
  if (unit === 'quarter') { const [y, m] = date.split('-'); return y + '-Q' + Math.ceil(parseInt(m) / 3); }
  return date;
}
function formatLabel(key, unit) {
  if (unit === 'day') return formatDate(key);
  if (unit === 'month') return key.slice(2, 4) + '.' + key.slice(5);
  return key.replace('-', ' ');
}
function renderChart() {
  const data = getFiltered();
  const all = [...new Set(rawData.map(d => d.product))];
  const products = [...new Set(data.map(d => d.product))];
  const groups = [...new Set(data.map(d => groupKey(d.date, selectedUnit)))].sort();
  const labels = groups.map(g => formatLabel(g, selectedUnit));
  const datasets = [];
  products.forEach(p => {
    const color = getColor(p, all);
    const pork = isPork(p);
    const isFocused = focusedProduct === p;
    const isDimmed = focusedProduct && !isFocused;
    const map = new Map();
    data.filter(d => d.product === p).forEach(d => {
      const g = groupKey(d.date, selectedUnit);
      if (!map.has(g)) map.set(g, []);
      map.get(g).push(d.price);
    });
    const values = groups.map(g => { const arr = map.get(g); return arr ? Math.round(arr.reduce((a,b) => a+b, 0) / arr.length) : null; });
    datasets.push({
      label: shortName(p), data: values,
      borderColor: isDimmed ? '#d1d5db' : color,
      backgroundColor: isDimmed ? 'transparent' : color + '15',
      tension: 0.3, spanGaps: true,
      pointRadius: isFocused ? 3 : (isDimmed ? 0 : 2),
      borderWidth: isFocused ? 3 : (isDimmed ? 1 : 2),
      borderDash: pork && !isDimmed ? [4, 3] : [],
      order: isFocused ? 0 : 1
    });
    if (isFocused && selectedUnit === 'day') {
      datasets.push({ label: shortName(p) + ' MA7', data: calcMA(values, 7), borderColor: '#f59e0b', borderWidth: 1.5, borderDash: [2, 2], pointRadius: 0, tension: 0.3, spanGaps: true, order: 0 });
      datasets.push({ label: shortName(p) + ' MA30', data: calcMA(values, 30), borderColor: '#8b5cf6', borderWidth: 1.5, borderDash: [4, 4], pointRadius: 0, tension: 0.3, spanGaps: true, order: 0 });
    }
  });
  if (chart) chart.destroy();
  chart = new Chart(document.getElementById('chart'), {
    type: 'line', data: { labels, datasets },
    options: {
      responsive: true, maintainAspectRatio: false,
      interaction: { mode: 'index', intersect: false },
      plugins: { legend: { display: false }, tooltip: { backgroundColor: 'rgba(15,23,42,0.95)', padding: 8, cornerRadius: 6, callbacks: { label: c => ' ' + c.dataset.label + ': ' + (c.parsed.y ? c.parsed.y.toLocaleString() + '원' : '-') } } },
      scales: {
        x: { ticks: { color: '#94a3b8', maxRotation: 0, font: { size: 10 } }, grid: { display: false }, border: { display: false } },
        y: { ticks: { color: '#94a3b8', font: { size: 10 }, callback: v => (v/1000) + 'k' }, grid: { color: '#f1f5f9' }, border: { display: false } }
      }
    }
  });
}
document.querySelectorAll('[data-days]').forEach(btn => { btn.onclick = () => { document.querySelectorAll('[data-days]').forEach(b => b.classList.remove('active')); btn.classList.add('active'); selectedDays = parseInt(btn.dataset.days); renderChart(); }; });
document.querySelectorAll('[data-unit]').forEach(btn => { btn.onclick = () => { document.querySelectorAll('[data-unit]').forEach(b => b.classList.remove('active')); btn.classList.add('active'); selectedUnit = btn.dataset.unit; renderChart(); }; });
document.querySelectorAll('[data-type]').forEach(btn => { btn.onclick = () => { document.querySelectorAll('[data-type]').forEach(b => b.classList.remove('active')); btn.classList.add('active'); selectedType = btn.dataset.type; focusedProduct = null; buildProducts(); renderChart(); }; });
loadData();
</script>
<script>
// Share
document.getElementById('shareBtn').onclick = () => {
  if (navigator.share) {
    navigator.share({ title: '메가마트 가격', text: '한우 · 삼겹살 가격 추적', url: location.href });
  } else {
    navigator.clipboard.writeText(location.href);
    alert('링크가 복사되었습니다');
  }
};
// Notification permission
document.getElementById('notifyBtn').onclick = async () => {
  if (!('Notification' in window)) { alert('이 브라우저는 알림을 지원하지 않습니다'); return; }
  const perm = await Notification.requestPermission();
  if (perm === 'granted') {
    localStorage.setItem('meat-notify', 'on');
    alert('알림이 설정되었습니다. 가격이 기준 이하로 떨어지면 알려드립니다.');
    new Notification('메가마트 가격', { body: '알림이 설정되었습니다', icon: 'favicon-192.png' });
  }
};
// PWA service worker
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('sw.js').catch(() => {});
}
</script>
